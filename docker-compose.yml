services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_dev
      MYSQL_DATABASE: erp_lite
      MYSQL_USER: erp
      MYSQL_PASSWORD: erp_dev
    ports: ["3306:3306"]
    volumes: ["erp_mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    target: api
    env_file: .env
    environment:
      DATABASE_URL: mysql://erp:erp_dev@db:3306/erp_lite
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3001
      NODE_ENV: development
    ports: ["3001:3001"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "npx prisma migrate deploy --schema server/prisma/schema.prisma && npm run db:seed && npm start -w server"
  web:
    build:
      context: .
      target: web
    ports: ["5173:80"]
    depends_on: [app]
volumes:
  erp_mysql_data:
